[project]
name = "urjagrid-backend"
version = "0.1.0"
description = "UrjaGrid backend -- Schneider Electric Yuva Yodha Energy Tech Hackathon (PS3 Grid Reliability)"
requires-python = ">=3.12"

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = [".venv", "data"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = ["B008"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
